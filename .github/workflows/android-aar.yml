name: Android AAR

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'src/**', 'Cargo.toml', 'Cargo.lock']
  workflow_dispatch:

jobs:
  build:
    name: Build AAR (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.1.8937393
      - run: cargo install cargo-ndk
      - name: Build lib
        run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 3

  package:
    name: Assemble AAR
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage .so files
        run: |
          JNILIBS=android/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "$JNILIBS/$abi"
            cp "artifacts/lib-$abi/"*.so "$JNILIBS/$abi/" 2>/dev/null || true
          done
      - name: Assemble AAR
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: optima-release.aar
          path: android/app/build/outputs/aar/*.aar
          retention-days: 14
