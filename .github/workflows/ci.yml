name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libjack-dev pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libvulkan-dev

      - run: pkg-config --exists alsa && echo "alsa.pc found" || (echo "alsa.pc missing" && exit 1)

      - run: cargo clippy --all-targets

      - run: cargo check --all-targets

  build-android:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.1.8937393

      - run: cargo install cargo-ndk

      - name: Build
        env:
          RUST_FONTCONFIG_DLOPEN: 1
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 3

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libjack-dev pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libvulkan-dev

      - run: pkg-config --exists alsa && echo "alsa.pc found" || (echo "alsa.pc missing" && exit 1)

      - run: cargo build --release --lib
