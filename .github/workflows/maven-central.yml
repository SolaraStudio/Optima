name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.1.8937393
      - run: cargo install cargo-ndk
      - run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 1

  publish:
    name: Publish AAR to Maven Central
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage .so files
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            case "$target" in
              aarch64-linux-android) abi=arm64-v8a ;;
              armv7-linux-androideabi) abi=armeabi-v7a ;;
              i686-linux-android) abi=x86 ;;
              x86_64-linux-android) abi=x86_64 ;;
            esac
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "artifacts/lib-$target/"*.so "android/app/src/main/jniLibs/$abi/" 2>/dev/null || true
          done
      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon
