name: Publish Optima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.150.10)"
        required: true
        default: "0.150.10-dev"
      is_release:
        description: "Stable release? (no -SNAPSHOT suffix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-rust:
    name: Build Rust (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.1.8937393

      - run: cargo install cargo-ndk

      - name: Build
        env:
          RUST_FONTCONFIG_DLOPEN: 1
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 1

  package-aar:
    name: Package & Publish AAR
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy .so files to jniLibs
        run: |
          JNILIBS=android/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "$JNILIBS/$abi"
            cp "artifacts/lib-$abi/"*.so "$JNILIBS/$abi/" 2>/dev/null || true
          done
          find "$JNILIBS" -name "*.so" -exec ls -lh {} \;

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ "${{ github.event.inputs.is_release }}" != "true" ]]; then
              VERSION="${VERSION}-SNAPSHOT"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          else
            VERSION="0.150.10-SNAPSHOT"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build AAR
        env:
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew publish --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: optima-aar-${{ steps.version.outputs.VERSION }}
          path: android/app/build/outputs/aar/*.aar
          retention-days: 30

      - name: Summary
        run: |
          echo "## Optima ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- ABIs: arm64-v8a, armeabi-v7a, x86, x86_64" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "- Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          fi
