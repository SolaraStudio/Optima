name: Publish Optima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.150.10)"
        required: true
        default: "0.150.10-dev"
      is_release:
        description: "Is this a stable release? (no -SNAPSHOT suffix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Optima AAR
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-optima-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-optima-

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393

      # NEW STEP: Install cargo-ndk to automatically handle NDK paths for Rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # MODIFIED STEP: Wrapped cargo build inside "cargo ndk"
      - name: Build Rust (all ABIs)
        run: |
          # Define mapping between Rust target triples and Android platform targets
          declare -A targets
          targets=(
            ["aarch64-linux-android"]="aarch64-linux-android"
            ["armv7-linux-androideabi"]="armv7-linux-androideabi"
            ["i686-linux-android"]="i686-linux-android"
            ["x86_64-linux-android"]="x86_64-linux-android"
          )
          
          for target in "${!targets[@]}"; do
            echo "Building for target: $target"
            # cargo-ndk automatically references the correct NDK path environment variables
            cargo ndk --target "$target" --android-platform 21 -- build --release
          done

      - name: Copy .so files to jniLibs
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/armeabi-v7a
          mkdir -p android/src/main/jniLibs/x86
          mkdir -p android/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/*.so android/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/*.so android/src/main/jniLibs/armeabi-v7a/
          cp target/i686-linux-android/release/*.so android/src/main/jniLibs/x86/
          cp target/x86_64-linux-android/release/*.so android/src/main/jniLibs/x86_64/

      - name: Build AAR
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ "${{ github.event.inputs.is_release }}" != "true" ]]; then
              VERSION="${VERSION}-SNAPSHOT"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          else
            VERSION="0.150.10-SNAPSHOT"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew publish

      - name: (Optional) Upload AAR as artifact
        uses: actions/upload-artifact@v7
        with:
          name: optima-aar-${{ steps.version.outputs.VERSION }}
          path: android/build/outputs/aar/*.aar
          retention-days: 7
