name: Publish Optima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.150.10)"
        required: true
        default: "0.150.10-dev"
      is_release:
        description: "Is this a stable release? (no -SNAPSHOT suffix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    name: Build Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64
    env:
      RUST_BACKTRACE: 1
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ matrix.target }}-

      - name: Install sccache
        run: cargo install sccache

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust for ${{ matrix.target }}
        run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release

      - name: Upload .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 1

  package-aar:
    name: Package AAR
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all .so artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Copy .so files to jniLibs
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/armeabi-v7a
          mkdir -p android/src/main/jniLibs/x86
          mkdir -p android/src/main/jniLibs/x86_64
          cp artifacts/lib-arm64-v8a/*.so android/src/main/jniLibs/arm64-v8a/ || true
          cp artifacts/lib-armeabi-v7a/*.so android/src/main/jniLibs/armeabi-v7a/ || true
          cp artifacts/lib-x86/*.so android/src/main/jniLibs/x86/ || true
          cp artifacts/lib-x86_64/*.so android/src/main/jniLibs/x86_64/ || true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ "${{ github.event.inputs.is_release }}" != "true" ]]; then
              VERSION="${VERSION}-SNAPSHOT"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          else
            VERSION="0.150.10-SNAPSHOT"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build AAR
        env:
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew publish

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@v7
        with:
          name: optima-aar-${{ steps.version.outputs.VERSION }}
          path: android/build/outputs/aar/*.aar
          retention-days: 7
