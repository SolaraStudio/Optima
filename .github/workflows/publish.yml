name: Publish Optima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.150.10)"
        required: true
        default: "0.150.10-dev"
      is_release:
        description: "Is this a stable release? (no -SNAPSHOT suffix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    name: Build Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64
    env:
      RUST_BACKTRACE: 1
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libpulse-dev \
            libpipewire-0.3-dev

      - name: Auto-fix Rust code and format
        run: |
          cargo fix --target ${{ matrix.target }} --allow-dirty --allow-staged --broken-code || true
          cargo clippy --fix --target ${{ matrix.target }} --allow-dirty --allow-staged || true
          cargo fmt --all

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Cache cargo binaries
        uses: actions/cache@v5
        id: cargo-bin-cache
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Cache sccache compiled objects
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ matrix.target }}-

      - name: Install sccache if missing
        run: |
          if ! command -v sccache &> /dev/null; then
            cargo install sccache
          fi

      - name: Install cargo-ndk if missing
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk
          fi

      - name: Install cargo-chef if missing
        run: |
          if ! command -v cargo-chef &> /dev/null; then
            cargo install cargo-chef
          fi

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393

      - name: Add NDK compiler to PATH
        run: |
          echo "PATH=$ANDROID_NDK_HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Compute cargo-chef recipe
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cache dependencies (cargo chef)
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-chef-${{ matrix.target }}-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-chef-${{ matrix.target }}-

      - name: Build dependencies with cargo-chef
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: /home/runner/.cache/sccache
          CC_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-clang
          CXX_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-clang++
          AR_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-ar
        run: cargo chef cook --release --target ${{ matrix.target }} --recipe-path recipe.json

      - name: Build Rust for ${{ matrix.target }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: /home/runner/.cache/sccache
          CC_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-clang
          CXX_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-clang++
          AR_${{ matrix.target }}: ${{ env.ANDROID_NDK_HOME }}/bin/${{ matrix.target }}-ar
        run: cargo ndk --target ${{ matrix.target }} --platform 21 -- build --release

      - name: Upload .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/*.so
          retention-days: 1

  package-aar:
    name: Package AAR
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all .so artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Copy .so files to jniLibs
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/armeabi-v7a
          mkdir -p android/src/main/jniLibs/x86
          mkdir -p android/src/main/jniLibs/x86_64
          cp artifacts/lib-arm64-v8a/*.so android/src/main/jniLibs/arm64-v8a/ || true
          cp artifacts/lib-armeabi-v7a/*.so android/src/main/jniLibs/armeabi-v7a/ || true
          cp artifacts/lib-x86/*.so android/src/main/jniLibs/x86/ || true
          cp artifacts/lib-x86_64/*.so android/src/main/jniLibs/x86_64/ || true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ "${{ github.event.inputs.is_release }}" != "true" ]]; then
              VERSION="${VERSION}-SNAPSHOT"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          else
            VERSION="0.150.10-SNAPSHOT"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build AAR
        env:
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPTIMA_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd android
          ./gradlew publish

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@v7
        with:
          name: optima-aar-${{ steps.version.outputs.VERSION }}
          path: android/build/outputs/aar/*.aar
          retention-days: 7
