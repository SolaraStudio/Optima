name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.150.10)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ -z "$TAG" || "$TAG" == "GITHUB_REF" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name=="${{ steps.tag.outputs.tag }}")' 2>/dev/null || true)
          COMMITS=$(git log $(git describe --tags --abbrev=0 ${GITHUB_REF#refs/tags/}^ 2>/dev/null || echo HEAD)..HEAD --oneline 2>/dev/null | head -50 || echo "")
          echo "## Release ${{ steps.tag.outputs.version }}" > BODY.md
          echo "" >> BODY.md
          echo "$COMMITS" >> BODY.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Optima ${{ steps.tag.outputs.version }}"
          body_path: BODY.md
          draft: true
          generate_release_notes: true
