name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove the stale label or comment, or this will be closed in 7 days.'
          stale-pr-message: 'This PR is stale because it has been open 60 days with no activity. Remove the stale label or comment, or this will be closed in 7 days.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days after being marked stale.'
          close-pr-message: 'This PR was closed because it has been inactive for 7 days after being marked stale.'
          days-before-issue-stale: 60
          days-before-pr-stale: 60
          days-before-issue-close: 7
          days-before-pr-close: 7
          operations-per-run: 100
