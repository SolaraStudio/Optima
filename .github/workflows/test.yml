name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libjack-dev \
            pkg-config libssl-dev libfontconfig1-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Run tests
        run: cargo test --all-targets -- --skip ignored
