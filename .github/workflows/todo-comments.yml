name: Todo Comments

on:
  push:
    branches: [main, master]
  pull_request:
    paths: ['src/**']
  workflow_dispatch:

jobs:
  todos:
    name: Check for TODO/FIXME references
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search TODOs
        run: |
          echo "## TODO / FIXME references" >> $GITHUB_STEP_SUMMARY
          git grep -nE "TODO|FIXME|HACK|XXX" -- 'src/**/*.rs' | head -100 >> $GITHUB_STEP_SUMMARY || echo "None found" >> $GITHUB_STEP_SUMMARY
