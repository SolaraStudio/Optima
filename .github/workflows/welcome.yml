name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome new contributors
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! Please make sure you've included:
            - What you expected to happen
            - What actually happened
            - Steps to reproduce (if applicable)
          pr-message: |
            Thanks for your first pull request! Please ensure it follows our
            contribution guidelines and the CI checks pass. Welcome aboard!
