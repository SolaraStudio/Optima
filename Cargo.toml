[package]
name = "optima"
version = "0.150.0-dev"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Android integration
wry = "0.50"
jni = "0.21"
log = "0.4"
android_logger = "0.13"

# Rendering
vello = "0.4"
wgpu = "0.22"
vello_shaders = "0.4"

# Media
cpal = "0.15"
ffmpeg-next = "7.0"
reqwest = { version = "0.11", features = ["json", "stream"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
