[package]
name = "optima"
version = "0.150.10-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SolaraStudio"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Rendering (GPU)
vello = "0.10.0"
wgpu = "29.0.1"
vello_shaders = "0.10.0"

# Android integration
jni = "0.21"
log = "0.4"
android_logger = "0.13"

# Layout
taffy = { version = "0.6", features = ["grid", "flexbox"] }

# Text shaping and fonts (pure Rust)
rustybuzz = "0.14"
fontdue = "0.7"

# Networking (for font downloads)
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

# CSS parsing (for @font-face)
cssparser = "0.33"

# Audio
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
awedio = "0.5"

# Video
yscv-video = "0.1"

# Serialization (devtools)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc"] }

# Async utilities
pollster = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "rt"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
