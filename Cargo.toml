[package]
name = "optima"
version = "0.150.10-dev"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Rendering (GPU)
vello = "0.10.0"
wgpu = "29.0.1"
vello_shaders = "0.10.0"

# Android integration
jni = "0.21"
log = "0.4"
android_logger = "0.13"

# Layout
taffy = { version = "0.6", features = ["grid", "flexbox"] }

# Text shaping and fonts (pure Rust)
rustybuzz = "0.14"
fontdue = "0.7"

# Networking (for font downloads) - use rustls instead of openssl
reqwest = { version = "0.12", features = ["blocking", "stream", "json", "rustls-tls"], default-features = false }

# CSS parsing (for @font-face)
cssparser = "0.33"

# Media (optional for now)
cpal = "0.15"
ffmpeg-next = "7.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
